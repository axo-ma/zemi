[system]
version = "0.6"

[system.params]
locale = "en"

[system.params.defaults]
temperature = 0.2
max_tokens = 512

[component]
name = "two-arsenal-search"
stop_on_error = true

[component.params]
dataset_root = "@comp/data"

[component.params.generation]
__include__ = { ref = "system.params.defaults" }
max_tokens = 768

[[arsenals]]
id = "local"
config_path = "@comp/zemi/llm_curated_set_model_mode.toml"
lifecycle = "job"

[arsenals.params]
device = "cpu"
generation = { ref = "component.params.generation" }

[[arsenals]]
id = "remote"
config_path = "@comp/zemi/llm_external_providers.toml"
lifecycle = "external"

[arsenals.params]
device = "remote"

# A fixed Module needs neither Arsenal, ParamSpace, nor optimizer.
[[modules]]
id = "prepare"
kind = "playbook"
path = "@comp/prepare.ipynb"

[modules.params]
locale = { ref = "system.params.locale" }
dry_run = true

[[modules]]
id = "summarize-local"
kind = "playbook"
path = "@comp/playbook.ipynb"
arsenal = "local"
enabled = true

[modules.params]
__include__ = { ref = "component.params.generation" }
locale = { ref = "system.params.locale" }
device = { ref = "arsenals.local.params.device" }
temperature = { values = [0.0, 0.2, 0.5], start = 0.2 }
prompt_style = { values = ["brief", "detailed"] }

[modules.optimizer]
mode = "optimize"
strategy = "grid"
max_trials = 6
seed = 17

[modules.optimizer.sample_trial]
type = "@comp/zemi/sample_trial.py:TableDetectionSampleTrial"

[modules.optimizer.trial_dataset]
path = "@comp/data/eval.json"

[modules.optimizer.sample_trial.params]
language = { ref = "system.params.locale" }

[[modules]]
id = "extract-remote"
kind = "playbook"
path = "@comp/playbook_gbnf.ipynb"
arsenal = "remote"
enabled = true

[modules.params]
__include__ = [
  { ref = "system.params.defaults" },
  { ref = "component.params.generation" },
]
device = { ref = "arsenals.remote.params.device" }
schema_mode = { values = ["strict", "repair"] }
temperature = { range = { min = 0.0, max = 0.4, step = 0.2 } }

[modules.optimizer]
mode = "optimize"
strategy = "block_coordinate"
max_trials = 5
seed = 23
blocks = [["schema_mode", "temperature"]]

[modules.optimizer.sample_trial]
type = "@comp/sample_trials/extraction.py:ExtractionSampleTrial"

[modules.optimizer.trial_dataset]
path = "@comp/data/extraction.csv"

[modules.optimizer.sample_trial.params]
input_column = "text"
