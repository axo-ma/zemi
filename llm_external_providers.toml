# Values are resolved lazily from @inst/_secrets/arsenal.env.
[arsenal]
mode = "router"

[[arsenal.endpoints]]
name = "openrouter"
kind = "external"
protocol = "openai"
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key = { env = "OPENROUTER_API_KEY", prompt = "Введите API-ключ OpenRouter", secret = true }
healthcheck = "models"
connect_timeout = 5.0
request_timeout = 120.0
validate_model = false
    [[arsenal.endpoints.models]]
    name = "openrouter_model"
    model = { env = "OPENROUTER_MODEL", prompt = "Введите model ID OpenRouter", validate = "non_empty" }
        [[arsenal.endpoints.models.assistants]]
        name = "assistant"

[[arsenal.endpoints]]
name = "openrouter_free"
kind = "external"
protocol = "openai"
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key = { env = "OPENROUTER_API_KEY", prompt = "Введите API-ключ OpenRouter", secret = true }
healthcheck = "none"
connect_timeout = 5.0
request_timeout = 120.0
validate_model = false
    [[arsenal.endpoints.models]]
    name = "openrouter_free"
    model = "openrouter/free"
        [[arsenal.endpoints.models.assistants]]
        name = "assistant"

