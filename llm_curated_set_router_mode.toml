# Curated local GGUF set for llama.cpp Router Mode.
# One server hosts all models; select a model by its unique alias.

[arsenal]
mode = "router"

[[arsenal.llamas]]
name = "curated_router"
llama_build = "llama:b10507"
host = "127.0.0.1"
port = 8080
startup_timeout = 120.0

    # General-purpose Qwen 3.5 4B.
    [[arsenal.llamas.models]]
    name = "qwen35_4b"
    source = "hf"
    owner = "bartowski"
    repository = "Qwen_Qwen3.5-4B-GGUF"
    filename = "Qwen_Qwen3.5-4B-Q4_K_M.gguf"
    alias = "qwen3.5-4b"
    ctx_size = 4096
    threads = 4
    threads_batch = 4
    reasoning = "off"
        [[arsenal.llamas.models.assistants]]
        name = "assistant"

    # Compact Ling 3 model with reasoning disabled.
    [[arsenal.llamas.models]]
    name = "ling30_tiny"
    source = "hf"
    owner = "bloomer010"
    repository = "Ling-3.0-tiny-GGUF"
    filename = "Ling-3.0-tiny-Q4_K_M.gguf"
    alias = "ling-3.0-tiny"
